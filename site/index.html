<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>東京 新規指定マップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 地図が主役。左に処理月の棒グラフ・絞り込み・一覧、右に地図。スマホでは 月 → 地図 → 一覧 の縦積み */
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#16232A; --muted:#56666D; --line:#D3DCDA; --wash:#E9EFED;
  --ika:#2E5BC9; --shika:#0E8466; --yakkyoku:#AE3474;
  --ika-soft:#DCE5FA; --shika-soft:#D5EFE6; --yakkyoku-soft:#F5DCE9;
  --shadow:0 1px 2px rgba(22,35,42,.08),0 6px 20px rgba(22,35,42,.10);
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --s1:12px; --s2:13px; --s3:15px; --s4:18px; --s5:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F171B; --surface:#172228; --ink:#E3EBE9; --muted:#97A8AC; --line:#2B3B42; --wash:#1F2C33;
  --ika:#86A8FF; --shika:#4FCBA6; --yakkyoku:#F08BC3;
  --ika-soft:#22305A; --shika-soft:#123A30; --yakkyoku-soft:#45213A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F171B; --surface:#172228; --ink:#E3EBE9; --muted:#97A8AC; --line:#2B3B42; --wash:#1F2C33;
  --ika:#86A8FF; --shika:#4FCBA6; --yakkyoku:#F08BC3;
  --ika-soft:#22305A; --shika-soft:#123A30; --yakkyoku-soft:#45213A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--s3);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.side-scroll{overflow-y:auto;min-height:0;flex:1}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--wash)}

header.top{padding-block:16px 10px;display:grid;gap:4px}
header.top h1{margin:0;font-size:var(--s5);line-height:1.3;letter-spacing:.02em;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:var(--s1)}
.demo{margin-top:6px;font-size:var(--s1);background:var(--wash);border:1px dashed var(--line);border-radius:6px;padding:6px 10px}

/* 処理月ごとの件数（このページで一番目立たせる要素） */
.months{padding-block:6px 12px;border-bottom:1px solid var(--line)}
.months-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.months-head span{font-size:var(--s2);font-weight:700}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--muted);font-size:var(--s1);text-decoration:underline;cursor:pointer}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(26px,1fr);gap:4px;align-items:end;overflow-x:auto;padding-bottom:2px}
.bar{display:grid;grid-template-rows:auto 92px auto;gap:2px;justify-items:center;background:none;border:0;padding:2px 0;cursor:pointer;border-radius:6px}
.bar .stack{display:flex;flex-direction:column-reverse;width:18px;height:92px;justify-content:flex-start;border-radius:3px;overflow:hidden;background:var(--wash)}
.bar .seg{width:100%}
.bar .seg.retro{opacity:.4}
.bar .cnt{font-size:11px;color:var(--muted)}
.bar .lab{font-size:11px;line-height:1.2;color:var(--muted);white-space:nowrap}
.bar[aria-pressed="true"]{background:var(--wash)}
.bar[aria-pressed="true"] .lab,.bar[aria-pressed="true"] .cnt{color:var(--ink);font-weight:700}
.bar[aria-pressed="false"] .stack{opacity:.35}

/* 絞り込み */
.filters{display:grid;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fl{font-size:var(--s1);color:var(--muted);width:100%}
.seg-group{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg-group button{border:0;background:none;padding:5px 12px;font-size:var(--s2);cursor:pointer}
.seg-group button+button{border-left:1px solid var(--line)}
.seg-group button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cat{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;font-size:var(--s2);cursor:pointer}
.cat i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cat[aria-pressed="true"]{border-color:currentColor}
.cat[aria-pressed="false"]{color:var(--muted)}
.cat[aria-pressed="false"] i{opacity:.3}
.cat .n{color:var(--muted);font-size:var(--s1)}
select,input[type="search"]{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:var(--s2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:var(--s1);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{opacity:.7;margin-left:3px}
details.munis summary{cursor:pointer;font-size:var(--s1);color:var(--muted)}
details.munis[open] summary{margin-bottom:6px}
.check{display:flex;gap:6px;align-items:center;font-size:var(--s2);cursor:pointer}

/* 一覧 */
.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.summary b{font-size:var(--s4)}
.summary .tools{display:flex;gap:8px;align-items:center}
.summary select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:var(--s1);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
ul.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.active{background:var(--wash)}
.item .stripe{border-radius:2px}
.item h3{margin:0;font-size:var(--s3);line-height:1.45;font-weight:700}
.item .addr{font-size:var(--s2);color:var(--muted)}
.item .person{font-size:var(--s2);color:var(--ink);overflow-wrap:anywhere}
.item .person span{font-size:var(--s1);color:var(--muted);margin-right:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:var(--s1);color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;border-radius:4px;font-weight:700;margin-right:6px;vertical-align:2px}
.tag.ika{background:var(--ika-soft);color:var(--ika)} .tag.shika{background:var(--shika-soft);color:var(--shika)} .tag.yakkyoku{background:var(--yakkyoku-soft);color:var(--yakkyoku)}
.tag.retro{background:var(--wash);color:var(--muted);font-weight:400;border:1px solid var(--line)}
.empty{padding:32px 16px;color:var(--muted);text-align:center}
.foot{padding-block:16px 24px;font-size:var(--s1);color:var(--muted);display:grid;gap:4px}
.foot a{color:inherit}

/* 詳細 */
.detail{position:absolute;inset:0;background:var(--surface);z-index:5;overflow-y:auto;display:flex;flex-direction:column}
.detail-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.detail-body{padding-block:14px 32px;display:grid;gap:18px}
.detail h2{margin:0;font-size:var(--s5);line-height:1.35;text-wrap:balance}
.detail h4{margin:0 0 6px;font-size:var(--s2);color:var(--muted)}
dl.kv{display:grid;grid-template-columns:7.5em 1fr;margin:0;border-top:1px solid var(--line)}
dl.kv dt,dl.kv dd{padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--s2);margin:0;min-width:0;overflow-wrap:anywhere}
dl.kv dt{color:var(--muted);padding-right:8px}
dl.kv dd{white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:var(--s2);color:var(--ink)}
.note{font-size:var(--s1);color:var(--muted)}
.side-inner{position:relative;display:flex;flex-direction:column;min-height:0;flex:1}

/* 地図上の凡例 */
.legend{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:28px;z-index:900;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:var(--s1);display:grid;gap:2px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.approx{background:transparent!important;border:2px dashed var(--muted);width:8px;height:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.25);box-sizing:border-box}
.dot.approx{background:transparent!important;border:2.5px dashed;box-shadow:none}
.dot.sel{transform:scale(1.5);box-shadow:0 0 0 3px var(--ink)}
.clu{display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:12px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 25%,transparent)}
.muni-label{font-size:11px;color:var(--muted);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.pop h5{margin:0 0 2px;font-size:var(--s3)}
.pop p{margin:0;font-size:var(--s1);color:var(--muted)}
.pop button{margin-top:6px}

/* Leaflet の必要最小限のスタイル */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;mix-blend-mode:normal}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:0}
.leaflet-bar{border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.leaflet-bar a{display:block;width:34px;height:34px;line-height:34px;text-align:center;text-decoration:none;background:var(--surface);color:var(--ink);font-size:18px;font-weight:700}
.leaflet-bar a+a{border-top:1px solid var(--line)}
.leaflet-control-attribution{font-size:10px;padding:0 6px;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted)}
.leaflet-control-attribution a{color:inherit}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px}
.leaflet-popup-content{margin:12px 26px 12px 14px;line-height:1.45;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-close-button{position:absolute;top:2px;right:2px;border:none;width:24px;height:24px;font:18px/24px sans-serif;color:var(--muted);text-decoration:none;background:transparent;text-align:center}
.leaflet-fade-anim .leaflet-popup{transition:opacity .2s linear}
.leaflet-cluster-anim .leaflet-marker-icon{transition:transform .3s ease-out,opacity .3s ease-in}

@media (max-width:820px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .side{display:contents}
  .side-inner{display:contents}
  header.top{order:1}
  .months{order:2}
  .mapwrap{order:3;height:46vh;min-height:280px}
  .side-scroll{order:4;overflow:visible}
  .detail{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .summary{top:env(safe-area-inset-top,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-inner">
      <header class="top pad">
        <h1>東京都 保険医療機関・薬局の新規指定</h1>
        <p id="sourceLine">関東信越厚生局「新規指定一覧」を毎日確認して取り込んでいます</p>
        <div class="demo" id="demoNote" hidden>架空のサンプルデータで表示しています。GitHub に設置すると実データに置き換わります。</div>
      </header>

      <section class="months pad" aria-label="処理月">
        <div class="months-head"><span>処理月ごとの件数</span><button class="linkbtn" id="allMonths" type="button">全期間を選ぶ</button></div>
        <div class="bars" id="bars" role="group" aria-label="処理月を選ぶ"></div>
      </section>

      <div class="side-scroll" id="sideScroll">
        <section class="filters pad" aria-label="絞り込み">
          <div class="row" id="cats" role="group" aria-label="種別"></div>
          <div class="row">
            <div class="seg-group" id="areas" role="group" aria-label="地域"></div>
          </div>
          <div class="two">
            <label><span class="fl">二次保健医療圏</span><select id="region"></select></label>
            <label><span class="fl">指定の種類</span>
              <select id="sect">
                <option value="all">すべて</option>
                <option value="fresh">指定分（新たな開設）</option>
                <option value="retro">遡及指定分（開設者交代・移転など）</option>
              </select></label>
          </div>
          <details class="munis" id="muniBox">
            <summary id="muniSummary">市区町村で絞り込む</summary>
            <div class="chips" id="munis"></div>
          </details>
          <label><span class="fl">キーワード（名称・住所・開設者・管理者・診療科・電話・機関番号）</span>
            <input type="search" id="q" placeholder="例: 小児科、世田谷、医療法人" autocomplete="off"></label>
          <label class="check"><input type="checkbox" id="mapSync"> 地図に表示されている範囲だけを一覧に出す</label>
        </section>

        <div class="summary pad">
          <div><b class="num" id="count">0</b> 件 <span class="note" id="countSub"></span></div>
          <div class="tools">
            <select id="sort" aria-label="並び順">
              <option value="region">地域順</option>
              <option value="date">指定日の新しい順</option>
              <option value="name">名称順</option>
            </select>
            <button class="btn" id="csv" type="button">CSV</button>
          </div>
        </div>
        <ul class="list" id="list"></ul>
        <div class="foot pad" id="foot"></div>
      </div>

      <section class="detail" id="detail" hidden aria-label="詳細"></section>
    </div>
  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="地図"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--ika)"></i>医科</span>
      <span><i style="background:var(--shika)"></i>歯科</span>
      <span><i style="background:var(--yakkyoku)"></i>薬局</span>
      <span><i class="approx"></i>位置は市区町村の代表点</span>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
(() => {
const CATS = [
  {key:"医科", cls:"ika", color:"--ika"},
  {key:"歯科", cls:"shika", color:"--shika"},
  {key:"薬局", cls:"yakkyoku", color:"--yakkyoku"},
];
const REGIONS = {
  "区中央部":["千代田区","中央区","港区","文京区","台東区"],
  "区南部":["品川区","大田区"],
  "区西南部":["目黒区","世田谷区","渋谷区"],
  "区西部":["新宿区","中野区","杉並区"],
  "区西北部":["豊島区","北区","板橋区","練馬区"],
  "区東北部":["荒川区","足立区","葛飾区"],
  "区東部":["墨田区","江東区","江戸川区"],
  "西多摩":["青梅市","福生市","羽村市","あきる野市","瑞穂町","日の出町","檜原村","奥多摩町"],
  "南多摩":["八王子市","町田市","日野市","多摩市","稲城市"],
  "北多摩西部":["立川市","昭島市","国分寺市","国立市","東大和市","武蔵村山市"],
  "北多摩南部":["武蔵野市","三鷹市","府中市","調布市","小金井市","狛江市"],
  "北多摩北部":["小平市","東村山市","清瀬市","東久留米市","西東京市"],
  "島しょ":["大島町","利島村","新島村","神津島村","三宅村","御蔵島村","八丈町","青ヶ島村","小笠原村"],
};
const AREA_OF_REGION = r => r.startsWith("区") ? "23区" : (r === "島しょ" ? "島しょ" : "多摩");
const MUNI_ORDER = Object.values(REGIONS).flat();
const FIELDS = [
  ["category","種別"],["section","指定の区分"],["code","医療機関番号"],["code10","医療機関コード（10桁・参考）"],
  ["postal","郵便番号"],["address","所在地"],["municipality","市区町村"],["region","二次保健医療圏"],
  ["tel","電話番号"],["founder","開設者"],["manager","管理者"],["designated_wareki","指定年月日"],
  ["period_end","指定期間の終わり"],["staff","勤務医・薬剤師数"],["departments_full","診療科"],["departments","診療科（原本の略称）"],["beds","病床数"],
  ["reason","登録理由"],["status","状態"],["old_code","旧機関コード"],["note","備考"],["month_label","掲載（処理月）"],
];

const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catOf = k => CATS.find(c => c.key === k) || {key:k||"不明", cls:"", color:"--muted"};
const monthLabel = m => { const [y, mo] = m.split("-").map(Number); return {y, mo}; };
const wareki = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const r = y - 2018; return `令和${r === 1 ? "元" : r}年${m}月${d}日`;
};

let DATA = [], META = {}, MONTHS = [];
const state = {months:new Set(), cats:new Set(CATS.map(c => c.key)), area:"all", region:"", munis:new Set(), q:"", sect:"all", sort:"region", mapSync:false, selected:null};
const store = {
  load(){ try { return JSON.parse(localStorage.getItem("tks-filters") || "null"); } catch { return null; } },
  save(){ try { localStorage.setItem("tks-filters", JSON.stringify({cats:[...state.cats], area:state.area, region:state.region, munis:[...state.munis], sect:state.sect, sort:state.sort})); } catch {} },
};

async function loadData(){
  const seed = document.getElementById("seed");
  if (seed) {
    const s = JSON.parse(seed.textContent);
    $("demoNote").hidden = !s.meta?.demo;
    if (s.meta?.demo_note) $("demoNote").textContent = s.meta.demo_note;
    return [s.records, s.meta];
  }
  const tryFetch = async paths => { for (const p of paths) { try { const r = await fetch(p, {cache:"no-cache"}); if (r.ok) return r.json(); } catch {} } return null; };
  const [recs, meta] = await Promise.all([tryFetch(["data/records.json","../data/records.json"]), tryFetch(["data/meta.json","../data/meta.json"])]);
  return [recs || [], meta || {}];
}

/* ---------- 地図 ---------- */
let map, cluster, markers = new Map();
function initMap(demo){
  map = L.map("map", {zoomControl:true, preferCanvas:false}).setView([35.69, 139.55], 10);
  map.zoomControl.setPosition("topright");
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
    maxZoom:18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'
  }).addTo(map);
  cluster = L.markerClusterGroup({
    showCoverageOnHover:false, maxClusterRadius:42, disableClusteringAtZoom:16, spiderfyOnMaxZoom:true,
    iconCreateFunction: c => { const n = c.getChildCount(); const s = n < 10 ? 30 : n < 50 ? 36 : 44;
      return L.divIcon({html:`<div class="clu" style="width:${s}px;height:${s}px">${n}</div>`, className:"", iconSize:[s, s]}); }
  });
  map.addLayer(cluster);
  map.on("moveend", () => { if (state.mapSync) renderList(); });
  if (demo) addMuniLabels();
}
function addMuniLabels(){
  // サンプル表示用: 地図画像が読めない環境でも位置関係がわかるよう市区町村名を置く
  const pts = {};
  DATA.forEach(r => { if (r.lat && r.municipality) (pts[r.municipality] ||= []).push([r.lat, r.lng]); });
  Object.entries(pts).forEach(([m, ps]) => {
    const lat = ps.reduce((a, p) => a + p[0], 0) / ps.length, lng = ps.reduce((a, p) => a + p[1], 0) / ps.length;
    L.marker([lat, lng], {icon:L.divIcon({className:"", html:`<div class="muni-label">${esc(m)}</div>`, iconSize:[0,0]}), interactive:false, keyboard:false}).addTo(map);
  });
}
function markerFor(r){
  const c = catOf(r.category);
  const approx = r.geo_precision !== "address";
  const icon = L.divIcon({className:"", iconSize:[14,14], iconAnchor:[7,7],
    html:`<div class="dot ${approx ? "approx" : ""}" style="${approx ? `border-color:var(${c.color})` : `background:var(${c.color})`}"></div>`});
  const m = L.marker([r.lat, r.lng], {icon, title:r.name || "", keyboard:false});
  m.bindPopup(() => `<div class="pop"><h5>${esc(r.name)}</h5><p>${esc(r.category)}${r.retroactive ? "（遡及）" : ""}　${esc(r.address || "")}</p>
    <p>指定 ${esc(r.designated_wareki || "")}　${esc(r.reason || "")}</p>${r.manager ? `<p>管理者 ${esc(r.manager)}</p>` : ""}${approx ? `<p>位置は${esc(r.municipality || "")}の代表点です</p>` : ""}
    <button class="btn" type="button" data-open="${esc(r.id)}">全項目を見る</button></div>`);
  return m;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openDetail(b.dataset.open, false); });

/* ---------- 絞り込み ---------- */
function baseFilter(r, skip = ""){
  if (skip !== "month" && state.months.size && !state.months.has(r.month)) return false;
  if (skip !== "cat" && !state.cats.has(r.category)) return false;
  if (skip !== "sect" && state.sect === "fresh" && r.retroactive) return false;
  if (skip !== "sect" && state.sect === "retro" && !r.retroactive) return false;
  if (skip !== "area" && state.area !== "all" && r.area !== state.area) return false;
  if (skip !== "region" && state.region && r.region !== state.region) return false;
  if (skip !== "muni" && state.munis.size && !state.munis.has(r.municipality)) return false;
  if (state.q) {
    const hay = [r.name, r.address, r.founder, r.manager, (r.departments || []).join(" "), (r.departments_full || []).join(" "), r.tel, r.code, r.code10, r.municipality, r.region, r.reason, r.note, r.staff].join(" ").normalize("NFKC").toLowerCase();
    if (!state.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
const filtered = () => DATA.filter(r => baseFilter(r));

function renderBars(){
  const by = {}; MONTHS.forEach(m => by[m] = {});
  DATA.filter(r => baseFilter(r, "month")).forEach(r => { const k = r.category + (r.retroactive ? "_r" : ""); by[r.month][k] = (by[r.month][k] || 0) + 1; });
  const totals = MONTHS.map(m => Object.values(by[m]).reduce((a, b) => a + b, 0));
  const max = Math.max(1, ...totals);
  let prevY = null;
  $("bars").innerHTML = MONTHS.map((m, i) => {
    const {y, mo} = monthLabel(m);
    const segs = CATS.flatMap(c => [[c, false], [c, true]]).map(([c, retro]) => {
      const n = by[m][c.key + (retro ? "_r" : "")] || 0;
      return n ? `<div class="seg ${retro ? "retro" : ""}" style="height:${(n / max * 92).toFixed(1)}px;background:var(${c.color})"></div>` : "";
    }).join("");
    const lab = (prevY !== y ? `${y}年<br>` : "<br>") + `${mo}月`; prevY = y;
    const pressed = state.months.size === 0 || state.months.has(m);
    return `<button type="button" class="bar" data-m="${m}" aria-pressed="${pressed}" title="${esc(META.months?.[m]?.label || m)} ${totals[i]}件">
      <span class="cnt num">${totals[i]}</span><span class="stack">${segs}</span><span class="lab">${lab}</span></button>`;
  }).join("");
  $("bars").scrollLeft = $("bars").scrollWidth;
}

function renderFilters(){
  // 種別
  $("cats").innerHTML = CATS.map(c => {
    const n = DATA.filter(r => r.category === c.key && baseFilter(r, "cat")).length;
    return `<button type="button" class="cat" style="color:var(${c.color})" data-cat="${c.key}" aria-pressed="${state.cats.has(c.key)}"><i style="background:var(${c.color})"></i><span style="color:var(--ink)">${c.key}</span><span class="n num">${n}</span></button>`;
  }).join("");
  // 地域
  const areas = [["all","東京都全域"],["23区","23区"],["多摩","多摩"],["島しょ","島しょ"]];
  $("areas").innerHTML = areas.map(([k, l]) => {
    const n = DATA.filter(r => (k === "all" || r.area === k) && baseFilter(r, "area")).length;
    return `<button type="button" data-area="${k}" aria-pressed="${state.area === k}">${l} <span class="num" style="opacity:.7">${n}</span></button>`;
  }).join("");
  // 医療圏
  const regs = Object.keys(REGIONS).filter(r => state.area === "all" || AREA_OF_REGION(r) === state.area);
  if (state.region && !regs.includes(state.region)) state.region = "";
  $("region").innerHTML = `<option value="">すべての医療圏</option>` + regs.map(r => {
    const n = DATA.filter(x => x.region === r && baseFilter(x, "region")).length;
    return `<option value="${r}" ${state.region === r ? "selected" : ""}>${r}（${n}）</option>`;
  }).join("");
  // 市区町村
  const munis = MUNI_ORDER.filter(m => {
    const reg = Object.keys(REGIONS).find(r => REGIONS[r].includes(m));
    return (state.area === "all" || AREA_OF_REGION(reg) === state.area) && (!state.region || reg === state.region);
  });
  [...state.munis].forEach(m => { if (!munis.includes(m)) state.munis.delete(m); });
  $("munis").innerHTML = munis.map(m => {
    const n = DATA.filter(r => r.municipality === m && baseFilter(r, "muni")).length;
    return `<button type="button" class="chip" data-muni="${m}" aria-pressed="${state.munis.has(m)}">${m}<span class="n num">${n}</span></button>`;
  }).join("");
  $("muniSummary").textContent = state.munis.size ? `市区町村: ${[...state.munis].join("、")}（${state.munis.size}）` : "市区町村で絞り込む";
  $("sect").value = state.sect; $("sort").value = state.sort;
}

function sortRecs(rs){
  const key = {
    region: r => [Object.keys(REGIONS).indexOf(r.region) + 100, MUNI_ORDER.indexOf(r.municipality) + 100, r.name || ""].join("|"),
    date: r => r.designated || "",
    name: r => r.name || "",
  }[state.sort];
  const sorted = [...rs].sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  return state.sort === "date" ? sorted.reverse() : sorted;
}

let lastVisible = [];
function renderList(){
  let rs = filtered();
  if (state.mapSync && map) { const b = map.getBounds(); rs = rs.filter(r => r.lat && b.contains([r.lat, r.lng])); }
  rs = sortRecs(rs); lastVisible = rs;
  $("count").textContent = rs.length;
  const byCat = CATS.map(c => `${c.key} ${rs.filter(r => r.category === c.key).length}`).join("／");
  $("countSub").textContent = byCat;
  if (!rs.length) { $("list").innerHTML = `<li class="empty">条件に合う医療機関はありません。種別や地域の選択を広げてください。</li>`; return; }
  const cap = 400;
  $("list").innerHTML = rs.slice(0, cap).map(r => {
    const c = catOf(r.category);
    return `<li class="item pad ${state.selected === r.id ? "active" : ""}" data-id="${esc(r.id)}" tabindex="0">
      <span class="stripe" style="background:var(${c.color})"></span>
      <div style="min-width:0">
        <h3><span class="tag ${c.cls}">${esc(c.key)}</span>${r.retroactive ? `<span class="tag retro">遡及</span>` : ""}${esc(r.name || "（名称不明）")}</h3>
        <div class="addr">${esc(r.address || "")}</div>
        ${r.manager ? `<div class="person"><span>管理者</span>${esc(r.manager)}</div>` : ""}
        <div class="meta"><span>${esc(r.municipality || "")}${r.region ? `（${esc(r.region)}）` : ""}</span><span class="num">指定 ${esc(r.designated_wareki || "")}</span>${r.reason ? `<span>${esc(r.reason)}</span>` : ""}${(r.departments_full || r.departments) ? `<span>${esc((r.departments_full || r.departments).join("・"))}</span>` : ""}</div>
      </div></li>`;
  }).join("") + (rs.length > cap ? `<li class="empty">先頭 ${cap} 件を表示しています。条件を絞ると残りも表示されます。</li>` : "");
}

function renderMap(){
  if (!map) return;
  cluster.clearLayers(); markers.clear();
  const rs = filtered().filter(r => r.lat && r.lng);
  const ms = rs.map(r => { const m = markerFor(r); markers.set(r.id, m); m.on("click", () => highlight(r.id, false)); return m; });
  cluster.addLayers(ms);
}
function fitToFiltered(){
  const rs = filtered().filter(r => r.lat);
  if (!rs.length || !map) return;
  map.fitBounds(L.latLngBounds(rs.map(r => [r.lat, r.lng])).pad(0.08), {maxZoom:15, animate:false});
}

function renderAll(fit = false){
  renderBars(); renderFilters(); renderMap(); renderList(); store.save();
  if (fit) fitToFiltered();
}

/* ---------- 詳細 ---------- */
function highlight(id, flyTo){
  state.selected = id;
  document.querySelectorAll(".item.active").forEach(el => el.classList.remove("active"));
  document.querySelector(`.item[data-id="${CSS.escape(id)}"]`)?.classList.add("active");
  const m = markers.get(id);
  if (m && flyTo && cluster.hasLayer(m)) {
    map.once("moveend", () => { if (markers.get(id) === m && cluster.hasLayer(m)) { const p = cluster.getVisibleParent(m); if (p === m) m.openPopup(); else p?.spiderfy?.(); } });
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 16), {animate:false});
  }
}
function openDetail(id, flyTo = true){
  const r = DATA.find(x => x.id === id); if (!r) return;
  highlight(id, flyTo);
  const c = catOf(r.category);
  const val = k => { const v = r[k]; if (v == null || v === "") return null;
    if (k === "period_end") return wareki(v); if (k === "departments" || k === "departments_full") return v.join("、");
    if (k === "section") return v === "遡及指定分" ? "遡及指定分（開設者の交代・移転などで、前の指定日にさかのぼって指定）" : "指定分"; return v; };
  const kv = FIELDS.map(([k, l]) => [l, val(k)]).filter(([, v]) => v != null);
  const raw = (r.raw || []).map(([h, v]) => `<dt>${esc(h)}</dt><dd>${esc(v)}</dd>`).join("");
  const q = encodeURIComponent(`${r.name || ""} ${r.address || ""}`);
  const geo = r.lat ? `https://maps.gsi.go.jp/#17/${r.lat}/${r.lng}/` : null;
  const d = $("detail");
  d.innerHTML = `<div class="detail-head pad"><span class="tag ${c.cls}">${esc(c.key)}</span><button class="btn" type="button" id="closeDetail">一覧に戻る</button></div>
    <div class="detail-body pad">
      <h2>${esc(r.name || "（名称不明）")}</h2>
      <dl class="kv">${kv.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${raw ? `<div><h4>原本の記載（列の見出しと値をそのまま）</h4><dl class="kv">${raw}</dl></div>` : ""}
      <div class="links">
        <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google マップで開く</a>
        ${geo ? `<a href="${geo}" target="_blank" rel="noopener">地理院地図で開く</a>` : ""}
        ${r.source_url ? `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">原本（${r.source === "excel" ? "Excel" : "PDF"}）</a>` : ""}
      </div>
      ${r.geo_precision && r.geo_precision !== "address" ? `<p class="note">住所から正確な位置を特定できなかったため、地図上は${esc(r.municipality || "")}の代表点に置いています。</p>` : ""}
      ${!r.lat ? `<p class="note">住所から位置を特定できなかったため、地図には表示していません。</p>` : ""}
    </div>`;
  d.hidden = false; d.scrollTop = 0;
  $("closeDetail").focus();
}
function closeDetail(){ $("detail").hidden = true; const el = document.querySelector(`.item[data-id="${CSS.escape(state.selected || "")}"]`); el?.focus(); }

/* ---------- CSV ---------- */
function csv(){
  const cols = [["month_label","処理月"],["category","種別"],["section","指定の区分"],...FIELDS.filter(([k]) => !["category","section","month_label"].includes(k)),["lat","緯度"],["lng","経度"],["geo_precision","位置の精度"]];
  const cell = v => { v = Array.isArray(v) ? v.join(" ") : (v ?? ""); v = String(v).replace(/\r?\n/g, " "); return /[",]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const text = "﻿" + [cols.map(c => c[1]).join(","), ...lastVisible.map(r => cols.map(([k]) => cell(r[k])).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
  a.download = `tokyo-shinki-shitei-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- イベント ---------- */
function bind(){
  $("bars").addEventListener("click", e => {
    const b = e.target.closest(".bar"); if (!b) return;
    const m = b.dataset.m;
    if (e.shiftKey || e.metaKey || e.ctrlKey) { state.months.has(m) ? state.months.delete(m) : state.months.add(m); }
    else if (state.months.size === 1 && state.months.has(m)) { state.months.clear(); }
    else { state.months = new Set([m]); }
    renderAll(true);
  });
  $("allMonths").onclick = () => { state.months.clear(); renderAll(true); };
  $("cats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return;
    const k = b.dataset.cat; state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); if (!state.cats.size) CATS.forEach(c => state.cats.add(c.key)); renderAll(); });
  $("areas").addEventListener("click", e => { const b = e.target.closest("[data-area]"); if (!b) return; state.area = b.dataset.area; renderAll(true); });
  $("region").onchange = e => { state.region = e.target.value; renderAll(true); };
  $("sect").onchange = e => { state.sect = e.target.value; renderAll(); };
  $("sort").onchange = e => { state.sort = e.target.value; renderList(); store.save(); };
  $("munis").addEventListener("click", e => { const b = e.target.closest("[data-muni]"); if (!b) return;
    const m = b.dataset.muni; state.munis.has(m) ? state.munis.delete(m) : state.munis.add(m); renderAll(true); });
  let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.normalize("NFKC").toLowerCase().trim(); renderAll(); }, 200); });
  $("mapSync").onchange = e => { state.mapSync = e.target.checked; renderList(); };
  $("list").addEventListener("click", e => { const li = e.target.closest(".item"); if (li) openDetail(li.dataset.id); });
  $("list").addEventListener("keydown", e => { if (e.key === "Enter") { const li = e.target.closest(".item"); if (li) openDetail(li.dataset.id); } });
  $("detail").addEventListener("click", e => { if (e.target.id === "closeDetail") closeDetail(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("detail").hidden) closeDetail(); });
  $("csv").onclick = csv;
}

async function main(){
  [DATA, META] = await loadData();
  DATA.forEach(r => { if (!r.id) r.id = Math.random().toString(36).slice(2); });
  MONTHS = [...new Set([...Object.keys(META.months || {}), ...DATA.map(r => r.month)])].sort();
  const saved = store.load();
  if (saved) { state.cats = new Set(saved.cats?.length ? saved.cats : CATS.map(c => c.key)); Object.assign(state, {area:saved.area || "all", region:saved.region || "", sect:saved.sect || "all", sort:saved.sort || "region"}); state.munis = new Set(saved.munis || []); }
  if (MONTHS.length) state.months = new Set([MONTHS[MONTHS.length - 1]]);
  const demo = !!META.demo;
  if (demo) $("csv").hidden = true;
  const upd = META.updated_at ? `最終取り込み ${META.updated_at.slice(0,10)}` : "";
  const chk = META.checked_at ? `最終確認 ${META.checked_at.slice(0,10)}` : "";
  $("foot").innerHTML = `<span>${[upd, chk].filter(Boolean).join("／")}</span>
    <span>出典: <a href="https://kouseikyoku.mhlw.go.jp/kantoshinetsu/chousa/shitei.html" target="_blank" rel="noopener">関東信越厚生局 保険医療機関・保険薬局の新規指定一覧</a>（政令に基づく公示）。地図: 国土地理院。位置は住所から自動で求めたもので、ずれることがあります。</span>`;
  bind();
  if (window.L) initMap(demo); else $("map").innerHTML = `<p class="empty">地図を読み込めませんでした。通信状況を確認して再読み込みしてください。</p>`;
  renderAll(true);
  if (!DATA.length) $("list").innerHTML = `<li class="empty">まだデータがありません。GitHub の Actions で「Update data」を実行すると取り込まれます。</li>`;
}
main();
})();
</script>
