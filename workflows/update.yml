name: Update data

on:
  schedule:
    # 毎日 9:23（日本時間）に厚生局のページを確認。新しい処理月が出ていれば取り込む
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "取り直す処理月（例 2026-09）。全月なら all。空なら新しい月だけ"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch and parse
        run: |
          if [ -n "${{ github.event.inputs.force }}" ]; then
            python -m scraper.update --force "${{ github.event.inputs.force }}"
          else
            python -m scraper.update
          fi

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # 確認日時だけの変更はコミットしない
            if git diff --cached --name-only | grep -qv '^data/meta.json$' || [ -f notify.md ]; then
              git commit -m "data: $(date -u +%Y-%m-%d) 更新"
              git push
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Notify (issue)
        if: hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="新規指定: $(grep -m1 '^## ' notify.md | sed 's/^## //')"
          {
            cat notify.md
            echo
            echo "地図で見る: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } > body.md
          gh issue create --title "$title" --body-file body.md

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp data/records.json data/meta.json _site/data/ 2>/dev/null || echo "[]" > _site/data/records.json
          if [ "${{ needs.update.result }}" = "success" ] && [ -f _site/data/meta.json ]; then
            # 毎日の確認日時はコミットせず、公開ページにだけ反映する
            python3 -c "import json,datetime as d;p='_site/data/meta.json';m=json.load(open(p));m['checked_at']=d.datetime.now(d.timezone(d.timedelta(hours=9))).isoformat(timespec='seconds');json.dump(m,open(p,'w'),ensure_ascii=False)"
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
